version: 1
rule:
  cards:
    kwang:
      months:
      - 1
      - 3
      - 8
      - 11
      - 12
    dan:
      hongdan:
      - 1
      - 2
      - 3
      cheongdan:
      - 6
      - 9
      - 10
      chodan:
      - 4
      - 5
      - 7
    yul:
      godori:
      - 2
      - 4
      - 8
    pi:
      double_pi_months: []
      conditional_double_pi:
      - month: 9
        condition: has_cheongdan
        bonus_points: 1
      bonus_cards: 2
    chrysanthemum_rule:
      enabled: true
      default_role: double_pi
      choice_timing: capture_time
      allow_double_pi: true
  scoring:
    kwang:
      samgwang: 3
      bisamgwang: 2
      sagwang: 4
      ogwang: 15
    dan:
      min_count: 5
      min_score: 1
      additional_score: 1
      hongdan: 3
      cheongdan: 3
      chodan: 3
    yul:
      min_count: 5
      min_score: 1
      additional_score: 1
      godori: 5
    pi:
      min_count: 10
      min_score: 1
      additional_score: 1
  go_stop:
    min_score_3_players: 3
    min_score_2_players: 7
    apply_bak_on_stop: false
    bak_only_if_opponent_go: true
    require_opponent_capture_for_scoring: true
    go_bonuses:
      3:
        add: 0
        multiply: 2
      4:
        add: 0
        multiply: 4
      1:
        add: 1
        multiply: 1
      2:
        add: 2
        multiply: 1
  starter:
    enabled: true
    mode: night_day
    first_launch_only: true
    day_start_hour: 6
    day_end_hour: 18
    description: "Apply \uBC24\uC77C\uB0AE\uC7A5 only once on the first app launch."
  penalties:
    gobak:
      enabled: true
      multiplier: 2
    gwangbak:
      enabled: true
      resolution_type: multiplier
      pi_to_transfer: 10
      opponent_max_kwang: 0
      multiplier: 2
    pibak:
      enabled: true
      resolution_type: multiplier
      pi_to_transfer: 5
      opponent_min_pi_safe: 8
      multiplier: 2
    mungbak:
      enabled: true
      resolution_type: multiplier
      pi_to_transfer: 3
      winner_min_animal: 7
      multiplier: 2
      description: Winner has 7+ animals and opponent is penalized
    jabak:
      enabled: true
      min_score_threshold: 7
      description: Nullify Bak if loser score >= threshold
    yeokbak:
      enabled: true
      description: Apply Bak penalty to the inducer if condition reverses
  special_moves:
    bomb:
      enabled: true
      steal_pi_count: 1
      score_multiplier: 1
      dummy_card_count: 2
      dummy_cards_disappear_on_play: true
      description: Play 3 identical month cards when 1 is on table
    shake:
      enabled: true
      score_multiplier_type: multiplicative
      description: 'Exponential shake: 2^n multiplier. Declared at start.'
    sweep:
      enabled: true
      bonus_points: 0
      score_multiplier_type: multiplicative
      steal_pi_count: 1
      allow_empty_start_via_jjok: true
      description: Clear all cards from table. Multiplies score (exponential) and
        steals 1 Pi. Empty-start Jjok can also count.
    ttadak:
      enabled: true
      steal_pi_count: 1
      first_turn_bonus_score: 10
      description: Match a floor card with hand and deck draw simultaneously
    jjok:
      enabled: true
      steal_pi_count: 1
      description: Match a card you just put down with deck draw
    seolsa:
      enabled: true
      penalty_pi_count: 0
      instant_win_count: 3
      instant_win_score: 10
      invalid_on_last_hand: true
      first_turn_bonus_score: 10
      description: Play and draw matching cards but making it a triple, leaving them
        on table (no automatic Pi transfer penalty). Last-hand Seolsa is ignored.
    seolsa_eat:
      enabled: true
      steal_pi_count: 1
      self_eat_steal_pi_count: 2
      description: Capture a pucked month
    mungbak_pi_threshold: 5
    mungdda:
      enabled: true
      steal_pi_count: 1
      multiplier_addition: 1
      description: Opponent Ttadak while player is in Pi-mungbak state
    bomb_mungdda:
      enabled: true
      steal_pi_count: 2
      multiplier_addition: 2
      description: Opponent Bomb while player is in Pi-mungbak state
    chongtong:
      enabled: true
      resolution_type: instant_win
      distinguish_timing: true
      initial_chongtong_score: 20
      midgame_chongtong_score: 10
      description: 4 cards of same month in hand
  nagari:
    enabled: true
    next_game_multiplier: 2
  endgame:
    max_round_score: 50
    score_check_timing: post_multiplier
    max_go_count: 5
    instant_end_on_bak:
      pibak: false
      gwangbak: false
      mungbak: false
      bomb_mungdda: false
animation:
  card_move_duration: 0e+0
  card_move_delay_per_item: 5e-2
  background_music_enabled: false
  animation_style: linear
  spring_response: 4e-1
  spring_damping: 7.5e-1
  spring_blend_duration: 0e+0
  deal_from_deck_duration: 5e-1
  capture_to_player_duration: 0e+0
  play_from_hand_duration: 9e-2
  hand_to_table_motion: instant
  deck_to_table_duration: 0e+0
  table_to_captured_duration: 0e+0
  captured_to_captured_duration: 0e+0
  deck_to_table_motion: instant
  table_to_captured_motion: instant
  captured_to_captured_motion: instant
  opponent_preplay_reveal_duration: 0e+0
  match_pause_duration: 0e+0
  show_trail: false
  card_rotation_enabled: true
  max_rotation_angle: 1.5e+1
  turn_change_delay: 3e-1
  turn_indicator_duration: 6e-1
  opponent_action_delay: 0e+0
app:
  first_launch_starter_applied: false
  language: ko
